plugins {
	id 'java'
}

group = 'net.runelite.client.plugins.microbot.beanscapeadmin'
version = '0.1.0'

def pluginJarName = 'BeanscapeAdminPlugin.jar'
def clientData = file(findProperty('clientDir') ?: "${System.getenv('APPDATA')}/Beanscape Client")
// -PmicrobotJar=... compiles against another client, e.g. staging's
// "%APPDATA%\Beanscape Client\servers\staging\original\microbot-2.6.57.jar".
def microbotJar = file(findProperty('microbotJar') ?: "${clientData}/original/microbot-2.0.20.jar")

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	compileOnly files(microbotJar)
	testImplementation files(microbotJar)
	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 11
}

jar {
	archiveFileName = pluginJarName
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Copies the jar into the Beanscape client's isolated Microbot home.
tasks.register('installToClient') {
	group = 'beanscape'
	description = 'Build and copy the plugin jar into the Beanscape client microbot-plugins folder'
	dependsOn jar
	doLast {
		def dir = file("${clientData}/home/.runelite/microbot-plugins")
		dir.mkdirs()
		copy {
			from jar.archiveFile.get().asFile
			into dir
		}
		println "Installed -> ${new File(dir, pluginJarName).absolutePath}"
	}
}
