# Umpix's in-client admin API (content/other/admin-api) ships with the server but its HTTP listener
# stays off until it has been reviewed. To turn it on, set this to true (or delete this file),
# commit, and let auto-deploy restart the server. It listens on 127.0.0.1:8087 only; exposing it
# on the tailnet also needs `tailscale serve --bg --set-path /adminapi http://127.0.0.1:8087`.
[Service]
Environment=ADMIN_API_ENABLED=false
