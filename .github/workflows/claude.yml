# Claude Code GitHub integration: mention @claude in an issue, PR comment or review and Claude
# works on it in a GitHub Actions runner (anthropics/claude-code-action, from its examples/claude.yml).
#
# Setup (once): install the Claude GitHub app on this repo (https://github.com/apps/claude), then add
# the repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` locally; Pro/Max subscription).
# To use an API key instead, add ANTHROPIC_API_KEY and swap the two auth lines below.
#
# Trust model (this repo is public):
# - TRUSTED users (people with write access) are listed twice below: in the job `if` and in
#   include_comments_by_actor. Keep both lists in sync when adding or removing people.
# - Claude runs only when the person mentioning @claude AND the issue/PR author are TRUSTED, and only
#   on PRs whose branch is in this repo (not a fork).
# - Claude only sees comments from TRUSTED users (plus its own), so outsiders' text can't steer it.
# - No code execution: Bash is limited to fixed read-only git commands. CI (ci.yml, read-only,
#   no secrets) builds and tests every PR Claude opens.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      contains(fromJSON('["chad-fiaschetti", "jsilva7674-cmd"]'), github.actor) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["chad-fiaschetti", "jsilva7674-cmd"]'), github.event.issue.user.login)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["chad-fiaschetti", "jsilva7674-cmd"]'), github.event.pull_request.user.login) &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["chad-fiaschetti", "jsilva7674-cmd"]'), github.event.pull_request.user.login) &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["chad-fiaschetti", "jsilva7674-cmd"]'), github.event.issue.user.login))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # push Claude's branches; it opens PRs rather than pushing to main
      pull-requests: write
      issues: write
      id-token: write # required: the action trades the OIDC token for a short-lived Claude app token
      actions: read # lets Claude read CI results on PRs
    steps:
      # issue_comment events on PRs don't carry the head repo, so resolve it before doing anything.
      - name: Refuse PRs from forks
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          head_repo=$(gh api "$PR_URL" --jq '.head.repo.full_name // ""')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR head is '$head_repo', not this repo; Claude does not run on fork PRs."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false # don't leave the workflow token in .git/config

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only trusted people's comments (and Claude's own) reach the prompt.
          include_comments_by_actor: "chad-fiaschetti,jsilva7674-cmd,claude[bot]"
          # Commits go through the GitHub API (signed, shown as Verified) instead of `git push`,
          # which is denied below.
          use_commit_signing: "true"
          # Fixed read-only git commands only; anything else is denied (nobody can approve in a
          # runner). No build/test scripts: Claude can edit files, so running repo scripts would
          # let it run arbitrary code. Edits and commits go through the action's own tools.
          claude_args: |
            --allowedTools "Bash(git status),Bash(git diff),Bash(git diff --stat),Bash(git log --oneline -20)"
            --disallowedTools "Bash(git push:*)"
