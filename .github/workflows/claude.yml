# Claude Code GitHub integration: mention @claude in an issue, PR comment or review and Claude
# works on it in a GitHub Actions runner (anthropics/claude-code-action, from its examples/claude.yml).
#
# Setup (once): install the Claude GitHub app on this repo (https://github.com/apps/claude), then add
# the repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` locally; Pro/Max subscription).
# To use an API key instead, add ANTHROPIC_API_KEY and swap the two auth lines below.
#
# Note: Claude can't reach VM 123 from a runner; it works on the overlay and runs
# scripts/build-overlay.sh like CI does (see CLAUDE.md / AGENTS.md).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only respond to people with write access, so random commenters on this public repo can't
    # spend the token or push changes.
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
