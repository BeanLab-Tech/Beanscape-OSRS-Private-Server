# Claude Code GitHub integration: mention @claude in an issue, PR comment or review and Claude
# works on it in a GitHub Actions runner (anthropics/claude-code-action, from its examples/claude.yml).
#
# Setup (once): install the Claude GitHub app on this repo (https://github.com/apps/claude), then add
# the repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` locally; Pro/Max subscription).
# To use an API key instead, add ANTHROPIC_API_KEY and swap the two auth lines below.
#
# Note: Claude can't reach VM 123 from a runner; it works on the overlay and runs
# scripts/build-overlay.sh like CI does (see CLAUDE.md / AGENTS.md).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # This repo is public, so Claude only runs when BOTH the person mentioning @claude AND the
    # author of the issue/PR it would read have write access (owner, org member or collaborator).
    # That keeps outsiders' text (possible prompt injection) away from a job holding a write token
    # and the Claude secret. PR review triggers must also come from a branch in this repo, not a fork.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association) &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # push Claude's branches; it opens PRs rather than pushing to main
      pull-requests: write
      issues: write
      id-token: write # required: the action trades the OIDC token for a short-lived Claude app token
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Bash is limited to the overlay build and read-only git; anything else is denied (no one
          # can approve it in a runner). Edits go through Claude's file tools inside the checkout.
          claude_args: |
            --allowedTools "Bash(scripts/build-overlay.sh:*),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Bash(git push:*)"
